<!DOCTYPE html>
<html lang="ru" data-theme="light" data-sth-style="glass"><!-- STHGroup: общий стиль -->
<head>
<meta charset="utf-8">
<title>База материалов и комплектующих — STHGroup</title>
<link rel="icon" href="img/logo.svg">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="matbase.css">
<link rel="stylesheet" href="sth_v2.css"><!-- STHGroup: цвета светлой и тёмной темы, как в окне программы -->
<link rel="stylesheet" href="sth_glass.css"><!-- STHGroup -->
<link rel="stylesheet" href="sth_ui_polish.css"><!-- STHGroup: общий стиль разделов -->
<link rel="stylesheet" href="sth_pane_fix.css"><!-- STHGroup: зазоры и полупрозрачные строки -->
<link rel="stylesheet" href="sth_visual_repairs.css"><!-- STHGroup: прозрачная подложка встроенной базы -->
<script>/* STHGroup: фон основного окна виден между панелями встроенной базы. */
if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.dataset.sthEmbedded = '1';
/* STHGroup 2.6.3: база внутри окна программы (раздел или панель выбора) — без внешних теней, их обрезает граница встроенной страницы */
if (window.parent !== window) document.documentElement.dataset.sthFramed = '1';
</script>
</head>
<body class="mb">
<div id="mbMenu"></div>
<div id="mbBar">
	<button id="bGrpAdd" title="Новая группа (внутри выбранной)">＋ Группа</button>
	<button id="bGrpEd" data-need="group" title="Изменить группу">✎ Группа</button>
	<button id="bGrpDel" data-need="group" class="icon" title="Удалить группу">✕</button>
	<i class="sep"></i>
	<button id="bMatAdd" title="Новый материал (Insert)">＋ Материал</button>
	<button id="bMatEd" data-need="mat" class="icon" title="Редактировать материал (Enter, двойной щелчок)">✎</button>
	<button id="bMatDel" data-need="mat" class="icon" title="Удалить материал (Delete)">✕</button>
	<button id="bMatMv" data-need="mat" title="Переместить выделенные в другую группу">⇢ В группу</button>
	<i class="sep"></i>
	<button id="bFilt" title="Показать или скрыть строку фильтров под заголовками">Фильтрация</button>
	<button id="bFiltClr" class="icon" title="Сбросить фильтры">⌫</button>
	<span class="grow"></span>
	<span id="mbState" class="mute"></span>
</div>
<div id="mbMain">
	<aside id="mbLeft">
		<div class="srch"><input type="search" id="mbQ" placeholder="Введите текст для поиска" spellcheck="false"><button id="mbFind">Найти</button><button id="mbClear">Очистить</button></div>
		<div class="cap">Группа материалов</div>
		<div id="mbTree"></div>
	</aside>
	<section id="mbRight">
		<div id="mbHeadWrap"><div id="mbHead"></div></div>
		<div id="mbScroll"><div id="mbRows"></div></div>
		<div id="mbSumBar"><span id="mbSum">Всего: 0</span><span class="grow"></span><span id="mbFile" class="mute"></span></div>
		<div id="mbBottom"><div id="mbRel" class="bp"></div><div id="mbOps" class="bp"></div></div>
	</section>
</div>
<div id="modals"></div>
<div id="toasts"></div>
<script src="core/geom.js"></script>
<script src="core/cut.js"></script>
<script src="core/project.js"></script>
<script src="core/sth_themes.js"></script><!-- STHGroup: те же две темы, что в программе -->
<script src="core/draw.js"></script>
<script src="core/dbf.js"></script>
<script src="core/zip.js"></script>
<script src="core/out_tab.js"></script>
<script src="core/matbase.js"></script>
<script src="ui/api.js"></script>
<script src="core/linkparse.js"></script>
<script src="ui/sth_shop.js"></script>
<script src="ui/matbase_ui.js"></script>
<script src="core/sth_restruct.js"></script><!-- STHGroup -->
<script src="ui/sth_mb.js"></script><!-- STHGroup -->
<script src="ui/sth_mb_layout.js"></script><!-- STHGroup: чистый разделитель панелей -->
<script src="ui/sth_restruct_ui.js"></script><!-- STHGroup -->
<script>MBW.init().catch(function (e) { UI.error(e); });</script>
</body>
</html>
